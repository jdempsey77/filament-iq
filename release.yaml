# release.yaml: the release contract (v1). Schema: _reorg/repo_contract_audit.md.
# Read by /merge and /deploy (d5-dev flow/) from the default branch only. Changing this file is tier 3.
contract: 1
tier: 2
branch: main
test: "/usr/bin/python3 -m pytest tests/ -q"
ci: true                           # .github/workflows/ci.yml: pytest on PRs to main
secrets: none                      # this repo deploys nothing; the Green's credentials are home-assistant-config's sops file
deploy:
  target: none                     # runs on the HA Green (AppDaemon), but is SHIPPED by home-assistant-config
  how: none
  order: 50
  ledger: none                     # the /deploy home-assistant-config ledger line covers it
  note: "Shipped by home-assistant-config (Jerry 2026-10-21, 'a'): a PR there runs scripts/sync_from_filament_iq.sh --ref <tag|sha> (pins .source-ref), then /deploy home-assistant-config copies the apps to the Green, restarts AppDaemon (print-guarded, auto-rollback) and its smoke checks the filament_iq apps loaded."
smoke: {command: null}             # how none: nothing to smoke here; home-assistant-config's scripts/smoke.sh checks the apps
rollback: hand                     # a home-assistant-config PR that re-syncs the previous ref, or /deploy home-assistant-config <older tag>
