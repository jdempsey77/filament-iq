# release.yaml: the release contract (v1). Schema: _reorg/repo_contract_audit.md.
# Read by /merge and /deploy (d5-dev flow/) from the default branch only. Changing this file is tier 3.
contract: 1
tier: 2
branch: main
test: "/usr/bin/python3 -m pytest tests/ -q"
ci: true                           # .github/workflows/ci.yml: pytest on PRs to main
secrets: deploy.env                # GAP: plaintext (home-assistant-config's scripts/deploy.env does the deploy), move to sops
deploy:
  target: ha-green
  how: hand
  order: 50
  ledger: script                   # manage_ha.sh (home-assistant-config) writes the ledger line; monitor/deploy.sh writes none
  note: "AppDaemon apps ship from home-assistant-config on the Mac: scripts/sync_from_filament_iq.sh --ref <tag> && scripts/manage_ha.sh --appdaemon. monitor/ -> ska by MONITOR_HOST=ska bash monitor/deploy.sh."
smoke: {command: null}             # GAP: no smoke check (manage_ha.sh --validate needs deploy.env)
rollback: hand                     # re-sync the previous tag (sync_from_filament_iq.sh --ref <prev>) and --appdaemon again
